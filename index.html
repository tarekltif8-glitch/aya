<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aya Boutique — أزياء راقية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700;900&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--gold:#d4af37;--gold-light:#f5d76e;
  --rose:#e8a5b0;--text:#f5f5f7;--muted:#8a8a96;--card:#1a1a24;
  --border:rgba(212,175,55,0.18);
}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;position:relative}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 20%, rgba(212,175,55,0.08), transparent 40%),radial-gradient(circle at 80% 70%, rgba(232,165,176,0.06), transparent 45%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--rose));border-radius:10px}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.5}

nav{position:fixed;top:0;right:0;left:0;z-index:100;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(20px);background:rgba(10,10,15,0.7);border-bottom:1px solid var(--border);transition:all 0.4s}
nav.scrolled{padding:12px 40px;background:rgba(10,10,15,0.92)}
.logo{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--rose),var(--gold));background-size:200% 200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s ease infinite;letter-spacing:1px}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.logo span{font-size:11px;display:block;letter-spacing:4px;color:var(--muted);-webkit-text-fill-color:var(--muted);font-family:'Cairo';font-weight:300;text-align:center;margin-top:-4px}
.nav-links{display:flex;gap:30px;align-items:center}
.nav-links a{color:var(--text);text-decoration:none;font-size:14px;font-weight:500;position:relative;padding:6px 0;transition:color 0.3s}
.nav-links a::after{content:'';position:absolute;bottom:0;right:0;width:0;height:1px;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width 0.4s}
.nav-links a:hover{color:var(--gold)}
.nav-links a:hover::after{width:100%}
.cart-btn{position:relative;background:linear-gradient(135deg,rgba(212,175,55,0.15),rgba(232,165,176,0.15));border:1px solid var(--border);color:var(--gold);padding:10px 20px;border-radius:50px;cursor:pointer;font-family:'Cairo';font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;transition:all 0.3s}
.cart-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(212,175,55,0.2)}
.cart-count{position:absolute;top:-6px;left:-6px;background:linear-gradient(135deg,var(--rose),var(--gold));color:#000;font-size:11px;font-weight:900;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform 0.4s cubic-bezier(0.68,-0.55,0.265,1.55)}
.cart-count.show{transform:scale(1)}
.cart-count.bump{animation:bump 0.5s ease}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}

.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 20px 60px;position:relative;z-index:2;overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:-1}
.hero-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(0.35) saturate(1.1)}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,15,0.6) 0%,rgba(10,10,15,0.85) 60%,var(--bg) 100%)}
.hero-badge{display:inline-block;padding:8px 20px;border-radius:50px;background:rgba(212,175,55,0.08);border:1px solid var(--border);color:var(--gold);font-size:12px;letter-spacing:3px;font-weight:500;margin-bottom:30px;opacity:0;animation:fadeUp 1s 0.2s forwards}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(42px,9vw,120px);font-weight:900;line-height:1;margin-bottom:24px;opacity:0;animation:fadeUp 1s 0.4s forwards}
.hero h1 .word{display:inline-block;background:linear-gradient(180deg,#fff 0%,#d4af37 60%,#8a6d1f 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transform:translateY(100px) rotateX(-90deg);opacity:0;animation:wordIn 1s cubic-bezier(0.16,1,0.3,1) forwards}
.hero h1 .word:nth-child(2){animation-delay:0.6s;font-style:italic;background:linear-gradient(180deg,var(--rose),#d4af37);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{max-width:560px;color:var(--muted);font-size:16px;line-height:1.8;margin-bottom:40px;opacity:0;animation:fadeUp 1s 1s forwards}
.hero-cta{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fadeUp 1s 1.2s forwards}
.btn{padding:16px 36px;border-radius:50px;font-family:'Cairo';font-weight:700;font-size:15px;cursor:pointer;border:none;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;text-decoration:none;display:inline-block}
.btn-primary{background:linear-gradient(135deg,var(--gold),#b8932a);color:#000;box-shadow:0 10px 40px rgba(212,175,55,0.3)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 60px rgba(212,175,55,0.5)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-3px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes wordIn{to{transform:translateY(0) rotateX(0);opacity:1}}
.scroll-hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:11px;letter-spacing:3px;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fadeUp 1s 1.6s forwards}
.scroll-hint .line{width:1px;height:50px;background:linear-gradient(180deg,var(--gold),transparent);animation:scrollLine 2s ease infinite}
@keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

.section{padding:100px 40px;position:relative;z-index:2;max-width:1400px;margin:0 auto}
.section-head{text-align:center;margin-bottom:60px}
.section-head .eyebrow{color:var(--gold);font-size:12px;letter-spacing:4px;font-weight:500;margin-bottom:12px;display:block}
.section-head h2{font-family:'Playfair Display',serif;font-size:clamp(32px,5vw,64px);font-weight:900;background:linear-gradient(180deg,#fff,#8a8a96);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.reveal{opacity:0;transform:translateY(60px);transition:all 1s cubic-bezier(0.16,1,0.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
.loading .spinner{width:50px;height:50px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}

.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:30px}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:24px;overflow:hidden;position:relative;cursor:pointer;transition:all 0.6s cubic-bezier(0.16,1,0.3,1);opacity:0;transform:translateY(50px)}
.product-card.in{opacity:1;transform:translateY(0)}
.product-card:hover{transform:translateY(-10px) scale(1.02);border-color:var(--gold);box-shadow:0 30px 80px rgba(212,175,55,0.15)}
.product-img-wrap{position:relative;aspect-ratio:3/4;overflow:hidden;background:linear-gradient(135deg,#1a1a24,#252530)}
.product-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(0.16,1,0.3,1);opacity:0}
.product-img-wrap img.loaded{opacity:1}
.product-card:hover .product-img-wrap img{transform:scale(1.1)}
.product-tag{position:absolute;top:16px;right:16px;background:rgba(10,10,15,0.85);backdrop-filter:blur(10px);border:1px solid var(--border);padding:6px 14px;border-radius:50px;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--gold)}
.product-tag.out{color:#ff5c5c;border-color:rgba(255,92,92,0.3)}
.product-info{padding:22px}
.product-info h3{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;margin-bottom:8px}
.product-info .price{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:6px}
.product-info .sizes-mini{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.size-mini{padding:4px 10px;border-radius:6px;background:rgba(212,175,55,0.08);border:1px solid var(--border);font-size:11px;color:var(--muted)}
.size-mini.disabled{opacity:0.3;text-decoration:line-through}

.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(5,5,10,0.85);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity 0.4s}
.modal-overlay.show{display:flex;opacity:1}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:28px;max-width:1000px;width:100%;max-height:92vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;position:relative;transform:scale(0.9) translateY(30px);transition:transform 0.5s cubic-bezier(0.16,1,0.3,1)}
.modal-overlay.show .modal{transform:scale(1) translateY(0)}
.modal-close{position:absolute;top:16px;left:16px;z-index:10;width:40px;height:40px;border-radius:50%;background:rgba(10,10,15,0.8);backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s}
.modal-close:hover{background:var(--gold);color:#000;transform:rotate(90deg)}

.slider{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:28px 0 0 28px;background:#0a0a0f;touch-action:pan-y;user-select:none}
.slides{display:flex;height:100%;transition:transform 0.7s cubic-bezier(0.16,1,0.3,1)}
.slide{min-width:100%;height:100%;position:relative}
.slide img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.slide.active .slide-zoom{animation:kenburns 5s ease forwards}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12)}}
.slide .slide-zoom{width:100%;height:100%}
.slider-dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.slider-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.4);cursor:pointer;transition:all 0.3s}
.slider-dots span.active{background:var(--gold);width:24px;border-radius:10px}

.details{padding:40px 36px;display:flex;flex-direction:column;gap:20px}
.details h2{font-family:'Playfair Display',serif;font-size:32px;font-weight:900}
.details .price-lg{font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.details .desc{color:var(--muted);font-size:14px;line-height:1.8}
.size-label{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--gold);margin-bottom:10px}
.sizes{display:flex;gap:10px;flex-wrap:wrap}
.size-btn{min-width:52px;padding:12px 16px;border-radius:12px;background:rgba(212,175,55,0.06);border:1px solid var(--border);color:var(--text);font-family:'Cairo';font-weight:700;font-size:14px;cursor:pointer;transition:all 0.3s;position:relative}
.size-btn:hover:not(.disabled){border-color:var(--gold);transform:translateY(-2px)}
.size-btn.active{background:linear-gradient(135deg,var(--gold),#b8932a);color:#000;border-color:var(--gold);transform:scale(1.05)}
.size-btn.disabled{opacity:0.3;cursor:not-allowed;text-decoration:line-through}
.size-btn .qty-badge{position:absolute;top:-6px;left:-6px;background:var(--rose);color:#000;font-size:9px;font-weight:900;padding:2px 6px;border-radius:10px}
.qty-row{display:flex;align-items:center;gap:16px;margin-top:6px}
.qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.qty-ctrl button{width:40px;height:42px;background:transparent;border:none;color:var(--gold);font-size:20px;font-weight:700;cursor:pointer;transition:background 0.3s}
.qty-ctrl button:hover{background:rgba(212,175,55,0.1)}
.qty-ctrl span{min-width:44px;text-align:center;font-weight:900;font-size:16px}
.add-btn{flex:1;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#b8932a);color:#000;font-family:'Cairo';font-weight:900;font-size:15px;border:none;cursor:pointer;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);letter-spacing:1px}
.add-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 15px 40px rgba(212,175,55,0.4)}
.add-btn:disabled{opacity:0.4;cursor:not-allowed}

.fly-img{position:fixed;z-index:2000;width:80px;height:80px;border-radius:14px;object-fit:cover;pointer-events:none;box-shadow:0 20px 50px rgba(212,175,55,0.6);transition:all 0.9s cubic-bezier(0.5,0,0.2,1)}

.cart-drawer{position:fixed;top:0;left:0;bottom:0;width:min(440px,100vw);background:var(--bg2);border-right:1px solid var(--border);z-index:1001;transform:translateX(-100%);transition:transform 0.5s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column;box-shadow:20px 0 60px rgba(0,0,0,0.6)}
.cart-drawer.open{transform:translateX(0)}
.cart-head{padding:24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cart-head h3{font-family:'Playfair Display',serif;font-size:24px;font-weight:900}
.cart-close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;transition:color 0.3s}
.cart-close:hover{color:var(--gold)}
.cart-items{flex:1;overflow-y:auto;padding:16px 24px}
.cart-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);animation:slideIn 0.5s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
.cart-item img{width:70px;height:90px;object-fit:cover;border-radius:10px;flex-shrink:0}
.cart-item-info{flex:1;min-width:0}
.cart-item-info h4{font-size:15px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-info .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.cart-item-info .meta b{color:var(--gold)}
.cart-qty{display:flex;align-items:center;gap:8px}
.cart-qty button{width:26px;height:26px;border-radius:8px;background:rgba(212,175,55,0.1);border:1px solid var(--border);color:var(--gold);font-weight:900;cursor:pointer;transition:all 0.3s}
.cart-qty button:hover{background:var(--gold);color:#000}
.cart-qty span{font-weight:900;min-width:20px;text-align:center;font-size:14px}
.cart-remove{background:none;border:none;color:#ff5c5c;cursor:pointer;font-size:16px;padding:4px}
.cart-item-price{font-weight:900;color:var(--gold);font-size:15px;white-space:nowrap}
.cart-foot{padding:20px 24px;border-top:1px solid var(--border);background:rgba(10,10,15,0.6)}
.cart-total{display:flex;justify-content:space-between;margin-bottom:16px;font-size:16px}
.cart-total b{font-size:22px;background:linear-gradient(135deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.checkout-btn{width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--gold),#b8932a);color:#000;font-family:'Cairo';font-weight:900;font-size:16px;border:none;cursor:pointer;transition:all 0.3s}
.checkout-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 15px 40px rgba(212,175,55,0.4)}
.checkout-btn:disabled{opacity:0.4;cursor:not-allowed}
.empty-cart{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-cart svg{opacity:0.3;margin-bottom:16px}

.size-popup{position:fixed;inset:0;z-index:1500;background:rgba(5,5,10,0.85);backdrop-filter:blur(15px);display:none;align-items:center;justify-content:center;padding:20px}
.size-popup.show{display:flex}
.size-popup-inner{background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:28px;max-width:380px;width:100%;transform:scale(0.8);transition:transform 0.4s cubic-bezier(0.68,-0.55,0.265,1.55)}
.size-popup.show .size-popup-inner{transform:scale(1)}
.size-popup h4{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:16px;text-align:center}
.size-popup .sizes{justify-content:center}
.size-popup .size-btn{min-width:60px;padding:14px}

.checkout-form{position:fixed;inset:0;z-index:1200;background:rgba(5,5,10,0.9);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;padding:20px}
.checkout-form.show{display:flex}
.checkout-form .form-inner{background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:32px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;transform:translateY(30px);opacity:0;transition:all 0.5s cubic-bezier(0.16,1,0.3,1)}
.checkout-form.show .form-inner{transform:translateY(0);opacity:1}
.form-inner h3{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:20px;text-align:center}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.form-group input,.form-group textarea{width:100%;padding:13px 16px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text);font-family:'Cairo';font-size:14px;transition:all 0.3s;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:var(--gold);background:rgba(212,175,55,0.05)}
.form-group textarea{resize:vertical;min-height:80px}
.form-actions{display:flex;gap:10px;margin-top:22px}
.form-actions button{flex:1;padding:14px;border-radius:12px;font-family:'Cairo';font-weight:700;cursor:pointer;border:none;transition:all 0.3s}
.btn-cancel{background:rgba(255,255,255,0.05);color:var(--muted)}
.btn-cancel:hover{background:rgba(255,92,92,0.15);color:#ff5c5c}
.btn-submit{background:linear-gradient(135deg,var(--gold),#b8932a);color:#000}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(212,175,55,0.4)}

.success-screen{position:fixed;inset:0;z-index:1300;background:rgba(5,5,10,0.95);backdrop-filter:blur(20px);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.success-screen.show{display:flex}
.success-check{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#b8932a);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:popCheck 0.8s cubic-bezier(0.68,-0.55,0.265,1.55)}
@keyframes popCheck{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.success-check svg{width:50px;height:50px;stroke:#000;stroke-width:3;fill:none;stroke-dasharray:100;stroke-dashoffset:100;animation:drawCheck 0.6s 0.4s forwards}
@keyframes drawCheck{to{stroke-dashoffset:0}}
.success-screen h2{font-family:'Playfair Display',serif;font-size:32px;margin-bottom:12px;background:linear-gradient(135deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.success-screen p{color:var(--muted);max-width:400px;line-height:1.8;margin-bottom:24px}

footer{text-align:center;padding:60px 20px 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);position:relative;z-index:2}
footer .brand{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:12px;color:var(--gold)}
.socials{display:flex;justify-content:center;gap:20px;margin:24px 0}
.social-btn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid var(--border);transition:all 0.4s cubic-bezier(0.16,1,0.3,1);color:var(--text);text-decoration:none}
.social-btn:hover{transform:translateY(-6px) scale(1.1);border-color:var(--gold)}
.social-btn.fb:hover{background:linear-gradient(135deg,#1877f2,#0d5bcf);color:#fff;border-color:#1877f2;box-shadow:0 15px 40px rgba(24,119,242,0.4)}
.social-btn.ig:hover{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;border-color:#dc2743;box-shadow:0 15px 40px rgba(220,39,67,0.4)}
.social-btn svg{width:24px;height:24px;fill:currentColor}
