<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALYASIMIN ABAYA | مستقبل الأناقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0c;
  --surface: rgba(255, 255, 255, 0.03);
  --surface-hover: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.08);
  --text: #ffffff;
  --text-muted: #8b8b93;
  --gold: #d4af37;
  --gold-glow: rgba(212, 175, 55, 0.2);
  --accent: #e5c158;
  --blur: blur(20px);
  --u: min(calc(100vw / 1600), calc(100vh / 900));
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Tajawal', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.wide { font-family: 'Cairo', sans-serif; font-weight: 700; }

/* ====== الخلفية الحية المتحركة ====== */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.4;
  will-change: transform;
  transition: transform 0.1s linear;
}
.orb-1 { width: 500px; height: 500px; background: #3a2a1a; top: -10%; right: -10%; }
.orb-2 { width: 400px; height: 400px; background: #1a2a3a; bottom: -10%; left: -10%; }
.orb-3 { width: 300px; height: 300px; background: #4a3525; top: 40%; left: 30%; opacity: 0.2; }

/* ====== الهيدر الزجاجي ====== */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(10, 10, 12, 0.6);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border-bottom: 1px solid var(--border);
  transition: all 0.4s ease;
}
.brand {
  font-size: 22px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #fff, var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.nav-links { display: flex; gap: 30px; font-size: 14px; color: var(--text-muted); }
.nav-links a { transition: color 0.3s; position: relative; cursor: pointer; }
.nav-links a:hover, .nav-links a.active { color: var(--gold); }
.nav-links a::after {
  content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px;
  background: var(--gold); transition: width 0.3s;
}
.nav-links a:hover::after, .nav-links a.active::after { width: 100%; }
.cart-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: 30px;
  background: var(--surface); border: 1px solid var(--border);
  transition: all 0.3s; font-size: 14px;
}
.cart-btn:hover { background: var(--surface-hover); border-color: var(--gold); }
.cart-count { background: var(--gold); color: #000; font-weight: bold; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 11px; }

/* ====== القسم الرئيسي (Hero) ====== */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 120px 20px 60px;
  position: relative;
}
.hero h1 {
  font-size: clamp(40px, 6vw, 80px);
  font-family: 'Cairo', sans-serif;
  line-height: 1.1;
  margin-bottom: 20px;
  animation: fadeUp 1s ease-out;
}
.hero h1 span {
  background: linear-gradient(135deg, #fff 0%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p {
  font-size: clamp(16px, 2vw, 20px);
  color: var(--text-muted);
  max-width: 600px;
  line-height: 1.6;
  margin-bottom: 40px;
  animation: fadeUp 1s ease-out 0.2s backwards;
}
.scroll-indicator {
  position: absolute; bottom: 30px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  color: var(--text-muted); font-size: 12px; letter-spacing: 2px;
  animation: bounce 2s infinite;
}

/* ====== شبكة المنتجات ====== */
.products-section { padding: 60px 5% 120px; }
.section-title {
  font-size: 32px; margin-bottom: 40px; text-align: center;
  font-family: 'Cairo', sans-serif;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 30px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}
.card:hover {
  transform: translateY(-10px) scale(1.02);
  border-color: rgba(212, 175, 55, 0.4);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px var(--gold-glow);
}
.card-img-wrap {
  width: 100%;
  aspect-ratio: 3/4;
  border-radius: 12px;
  overflow: hidden;
  background: #151518;
  position: relative;
  margin-bottom: 20px;
}
.card-img-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.6s ease;
}
.card:hover .card-img-wrap img { transform: scale(1.1); }
.card-info { text-align: right; }
.card-info h3 { font-size: 18px; margin-bottom: 8px; font-weight: 600; }
.card-info .price { color: var(--gold); font-size: 16px; font-weight: 700; }
.add-btn {
  margin-top: 15px; width: 100%; padding: 12px;
  background: transparent; border: 1px solid var(--gold);
  color: var(--gold); border-radius: 10px; font-weight: 600;
  transition: all 0.3s;
}
.card:hover .add-btn { background: var(--gold); color: #000; }

/* ====== النافذة المنبثقة (Quick View) ====== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal-content {
  background: rgba(20, 20, 25, 0.9);
  border: 1px solid var(--border);
  border-radius: 24px;
  width: 90%; max-width: 900px; max-height: 90vh;
  display: flex; overflow: hidden;
  transform: scale(0.9); transition: transform 0.3s;
}
.modal-overlay.open .modal-content { transform: scale(1); }
.modal-img { width: 50%; background: #111; position: relative; }
.modal-img img { width: 100%; height: 100%; object-fit: cover; }
.modal-details { width: 50%; padding: 40px; overflow-y: auto; }
.modal-details h2 { font-size: 28px; margin-bottom: 10px; }
.modal-details .price { color: var(--gold); font-size: 22px; margin-bottom: 20px; font-weight: 700; }
.size-label { font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
.sizes { display: flex; gap: 10px; margin-bottom: 30px; }
.size-btn {
  width: 45px; height: 45px; border-radius: 50%;
  border: 1px solid var(--border); color: #fff;
  transition: all 0.2s; font-weight: 600;
}
.size-btn.active, .size-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(212,175,55,0.1); }
.size-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.checkout-btn {
  width: 100%; padding: 16px; border-radius: 12px;
  background: var(--gold); color: #000; font-weight: 700; font-size: 16px;
  transition: transform 0.2s;
}
.checkout-btn:hover { transform: scale(1.02); }
.close-btn { position: absolute; top: 20px; left: 20px; font-size: 30px; color: #fff; cursor: pointer; z-index: 10; }

/* ====== سلة التسوق (Drawer) ====== */
.cart-drawer {
  position: fixed; top: 0; left: 0; bottom: 0; width: 400px;
  background: rgba(15, 15, 20, 0.95); backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  z-index: 1001; transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex; flex-direction: column;
}
.cart-drawer.open { transform: translateX(0); }
.cart-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--border); }
.cart-body { flex: 1; overflow-y: auto; padding: 20px; }
.cart-item { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
.cart-item img { width: 80px; height: 100px; object-fit: cover; border-radius: 8px; }
.cart-item-info h4 { font-size: 16px; margin-bottom: 5px; }
.cart-item-info p { color: var(--text-muted); font-size: 14px; }
.cart-footer { padding: 20px; border-top: 1px solid var(--border); }
.total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 20px; }
.checkout-form { display: none; }
.checkout-form.active { display: block; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
.form-group input, .form-group textarea {
  width: 100%; padding: 12px; background: rgba(255,255,255,0.05);
  border: 1px solid var(--border); border-radius: 8px; color: #fff;
  font-family: 'Tajawal', sans-serif;
}
.form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--gold); }

/* ====== التوست (إشعار) ====== */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translate(-50%, 20px);
  background: var(--gold); color: #000; padding: 12px 24px; border-radius: 30px;
  font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.3s;
  z-index: 2000;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }

/* ====== الأنميشن ====== */
@keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* ====== التجاوب مع الهاتف ====== */
@media (max-width: 768px) {
  .nav-links { display: none; }
  .modal-content { flex-direction: column; max-height: 95vh; }
  .modal-img { width: 100%; height: 350px; }
  .modal-details { width: 100%; padding: 20px; }
  .cart-drawer { width: 100%; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
  .card { padding: 10px; }
  .card-info h3 { font-size: 14px; }
  .card-info .price { font-size: 13px; }
  .add-btn { padding: 8px; font-size: 12px; }
}
</style>
</head>
<body>

<!-- الخلفية الحية -->
<div class="bg-canvas">
  <div class="orb orb-1" id="orb1"></div>
  <div class="orb orb-2" id="orb2"></div>
  <div class="orb orb-3" id="orb3"></div>
</div>

<!-- الهيدر -->
<header>
  <a href="#" class="brand wide">ALYASIMIN ABAYA</a>
  <nav class="nav-links wide">
    <a href="#" class="active">الرئيسية</a>
    <a href="#">الكتالوج</a>
    <a href="#">عن الدار</a>
  </nav>
  <button class="cart-btn wide" id="open-cart">
    السلة <span class="cart-count" id="cart-count">0</span>
  </button>
</header>

<!-- القسم الرئيسي -->
<section class="hero">
  <h1 class="wide">مستقبل الأناقة<br><span>يبدأ هنا</span></h1>
  <p>اكتشفي مجموعة ALYASIMIN ABAYA الجديدة. حيث تلتقي الحرفية العالية بالتصميم العصري في تجربة تسوق لا مثيل لها.</p>
  <div class="scroll-indicator wide">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    مرري للأسفل
  </div>
</section>

<!-- المنتجات -->
<section class="products-section">
  <h2 class="section-title wide">المجموعة الحصرية</h2>
  <div class="grid" id="products-grid"></div>
</section>

<!-- نافذة تفاصيل المنتج -->
<div class="modal-overlay" id="quick-view">
  <div class="modal-content">
    <button class="close-btn" id="close-qv">×</button>
    <div class="modal-img">
      <img id="qv-img" src="" alt="">
    </div>
    <div class="modal-details">
      <h2 class="wide" id="qv-name"></h2>
      <div class="price" id="qv-price"></div>
      <p style="color: #aaa; margin-bottom: 20px; line-height: 1.6;" id="qv-desc"></p>
      
      <div class="size-label wide">اختاري المقاس</div>
      <div class="sizes" id="qv-sizes"></div>
      
      <button class="checkout-btn wide" id="qv-add-btn">أضيفي إلى السلة</button>
    </div>
  </div>
</div>

<!-- سلة التسوق -->
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h2 class="wide" style="font-size:20px">سلة التسوق</h2>
    <button id="close-cart" style="font-size:24px">×</button>
  </div>
  <div class="cart-body" id="cart-body"></div>
  <div class="cart-footer">
    <div id="cart-summary">
      <div class="total-row wide"><span>الإجمالي</span><span id="cart-total">0 د.ل</span></div>
      <button class="checkout-btn wide" id="go-to-checkout">متابعة الطلب</button>
    </div>
    
    <form class="checkout-form" id="checkout-form">
      <div class="form-group"><label>الاسم الكامل</label><input type="text" name="name" required></div>
      <div class="form-group"><label>رقم الهاتف</label><input type="tel" name="phone" required></div>
      <div class="form-group"><label>المدينة</label><input type="text" name="city" required></div>
      <div class="form-group"><label>العنوان بالتفصيل</label><textarea name="address" rows="2" required></textarea></div>
      <button type="submit" class="checkout-btn wide" id="submit-order">إرسال الطلب</button>
      <button type="button" id="back-to-cart" style="width:100%; margin-top:10px; background:transparent; color:#aaa">رجوع</button>
    </form>
  </div>
</div>

<div class="toast wide" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, addDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// =======================================================
// إعدادات Firebase
// =======================================================
const firebaseConfig = {
  apiKey: "AIzaSyDOfbi23sVHpexkESPsmTlbuxbKcRgh2wo",
  authDomain: "ayya-25562.firebaseapp.com",
  projectId: "ayya-25562",
  storageBucket: "ayya-25562.firebasestorage.app",
  messagingSenderId: "317439048144",
  appId: "1:317439048144:web:d304d450842a09bc13e1d5",
  measurementId: "G-79VQJQX5YN"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const TG_TOKEN = '8930560233:AAGLXXXkt8hIkmH1ylrMKCMa4C5LZPh0Lus';
const TG_CHAT_ID = '8562530371';
const SIZES = ['S','M','L','XL'];

let PRODUCTS = [];
let CART = [];
let CURRENT_QV_PRODUCT = null;
let SELECTED_SIZE = null;

const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('ar-LY',{style:'currency',currency:'LYD',maximumFractionDigits:0}).format(n) + ' د.ل';

// تحميل السلة
try { CART = JSON.parse(localStorage.getItem('alyasimin-cart') || '[]'); } catch(e){}
function saveCart() {
  localStorage.setItem('alyasimin-cart', JSON.stringify(CART));
  updateCartUI();
}

// إشعار
function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('visible'), 3000);
}

// =======================================================
// جلب المنتجات
// =======================================================
function loadProducts() {
  onSnapshot(collection(db, 'products'), snap => {
    PRODUCTS = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>(a.order||0)-(b.order||0));
    renderGrid();
    updateCartUI();
  });
}

function renderGrid() {
  const grid = $('products-grid');
  if (!PRODUCTS.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:#888">لا توجد منتجات متاحة حالياً.</div>';
    return;
  }

  grid.innerHTML = PRODUCTS.map(p => {
    const hasImg = p.imageUrl && p.imageUrl.trim() !== '';
    const imgHTML = hasImg ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#555">بلا صورة</div>`;

    return `
      <div class="card" data-id="${p.id}">
        <div class="card-img-wrap">${imgHTML}</div>
        <div class="card-info">
          <h3 class="wide">${p.name}</h3>
          <div class="price">${money(p.price)}</div>
          <button class="add-btn wide" data-add="${p.id}">إضافة سريعة</button>
        </div>
      </div>
    `;
  }).join('');

  // التفاعل مع البطاقات
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-add]')) {
        e.stopPropagation();
        quickAdd(e.target.closest('[data-add]').dataset.add);
        return;
      }
      openQuickView(card.dataset.id);
    });
  });
}

// =======================================================
// نافذة المنتج
// =======================================================
function openQuickView(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  CURRENT_QV_PRODUCT = p;
  SELECTED_SIZE = null;

  $('qv-img').src = p.imageUrl || '';
  $('qv-name').textContent = p.name;
  $('qv-price').textContent = money(p.price);
  $('qv-desc').textContent = p.desc || 'قطعة مميزة من مجموعتنا الجديدة. صُممت لتبرز جمالك وتضيف لمسة من الفخامة لإطلالتك.';

  const sizesHTML = SIZES.map(s => {
    const stock = p.stock?.[s] || 0;
    return `<button class="size-btn wide" data-size="${s}" ${stock < 1 ? 'disabled' : ''}>${s}</button>`;
  }).join('');
  
  $('qv-sizes').innerHTML = sizesHTML;
  $('qv-sizes').querySelectorAll('.size-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      $('qv-sizes').querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      SELECTED_SIZE = btn.dataset.size;
      $('qv-add-btn').disabled = false;
    });
  });

  $('qv-add-btn').disabled = true;
  $('qv-add-btn').textContent = 'أضيفي إلى السلة';

  $('quick-view').classList.add('open');
}

$('close-qv').onclick = () => $('quick-view').classList.remove('open');
$('quick-view').onclick = (e) => { if(e.target === $('quick-view')) $('quick-view').classList.remove('open'); };

$('qv-add-btn').onclick = () => {
  if (!CURRENT_QV_PRODUCT || !SELECTED_SIZE) return;
  addToCart(CURRENT_QV_PRODUCT.id, SELECTED_SIZE);
  $('quick-view').classList.remove('open');
};

function quickAdd(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  const firstSize = SIZES.find(s => (p.stock?.[s] || 0) > 0);
  if (!firstSize) { showToast('نفد المخزون من هذه القطعة'); return; }
  addToCart(p.id, firstSize);
}

// =======================================================
// السلة
// =======================================================
function addToCart(id, size) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  const existing = CART.find(r => r.id === id && r.size === size);
  
  if (existing) {
    if (existing.qty + 1 > (p.stock?.[size] || 0)) { showToast('الكمية المطلوبة غير متوفرة'); return; }
    existing.qty++;
  } else {
    CART.push({ id, size, qty: 1 });
  }
  saveCart();
  showToast('تمت الإضافة إلى السلة');
  openCart();
}

function updateCartUI() {
  const count = CART.reduce((s, r) => s + r.qty, 0);
  $('cart-count').textContent = count;

  const body = $('cart-body');
  if (CART.length === 0) {
    body.innerHTML = '<div style="text-align:center;color:#888;margin-top:40px">سلتك فارغة</div>';
    $('cart-summary').style.display = 'none';
    return;
  }

  $('cart-summary').style.display = 'block';
  let total = 0;
  
  body.innerHTML = CART.map((row, i) => {
    const p = PRODUCTS.find(x => x.id === row.id) || { name: 'منتج محذوف', price: 0, imageUrl: '' };
    const lineTotal = p.price * row.qty;
    total += lineTotal;
    return `
      <div class="cart-item">
        <img src="${p.imageUrl || ''}" alt="">
        <div class="cart-item-info" style="flex:1">
          <h4 class="wide">${p.name}</h4>
          <p>مقاس: ${row.size} | ${money(p.price)}</p>
          <div style="display:flex; align-items:center; gap:10px; margin-top:10px">
            <button data-action="minus" data-i="${i}" style="border:1px solid #333; width:25px; height:25px; border-radius:5px">−</button>
            <span>${row.qty}</span>
            <button data-action="plus" data-i="${i}" style="border:1px solid #333; width:25px; height:25px; border-radius:5px">+</button>
          </div>
        </div>
        <div class="wide" style="font-size:14px">${money(lineTotal)}</div>
      </div>
    `;
  }).join('');

  $('cart-total').textContent = money(total);

  body.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const i = Number(btn.dataset.i);
      const action = btn.dataset.action;
      if (action === 'plus') {
        const row = CART[i];
        const p = PRODUCTS.find(x => x.id === row.id);
        if (row.qty + 1 > (p?.stock?.[row.size] || 0)) { showToast('الكمية غير متوفرة'); return; }
        row.qty++;
      } else {
        CART[i].qty--;
        if (CART[i].qty < 1) CART.splice(i, 1);
      }
      saveCart();
    };
  });
}

$('open-cart').onclick = openCart;
$('close-cart').onclick = () => $('cart-drawer').classList.remove('open');

function openCart() {
  $('cart-drawer').classList.add('open');
  $('checkout-form').classList.remove('active');
  $('cart-summary').style.display = CART.length ? 'block' : 'none';
  updateCartUI();
}

// =======================================================
// إتمام الطلب
// =======================================================
$('go-to-checkout').onclick = () => {
  if (!CART.length) return;
  $('cart-summary').style.display = 'none';
  $('checkout-form').classList.add('active');
};

$('back-to-cart').onclick = () => {
  $('checkout-form').classList.remove('active');
  $('cart-summary').style.display = 'block';
};

$('checkout-form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('submit-order');
  btn.disabled = true; btn.textContent = 'جارٍ التحقق...';

  const formData = new FormData(e.target);
  const customer = {
    name: formData.get('name'),
    phone: formData.get('phone'),
    city: formData.get('city'),
    address: formData.get('address')
  };

  try {
    let total = 0;
    const orderItems = [];

    for (const row of CART) {
      const pSnap = await getDoc(doc(db, 'products', row.id));
      if (!pSnap.exists()) throw new Error('منتج غير موجود');
      const p = pSnap.data();
      const stock = p.stock?.[row.size] || 0;
      
      if (stock < row.qty) {
        throw new Error(`الكمية غير كافية لـ ${p.name} (مقاس ${row.size})`);
      }
      
      total += p.price * row.qty;
      orderItems.push({ id: row.id, name: p.name, size: row.size, qty: row.qty, price: p.price });
    }

    // حفظ الطلب
    const orderData = {
      customer, items: orderItems, total, status: 'pending', createdAt: serverTimestamp()
    };
    
    await addDoc(collection(db, 'orders'), orderData);

    // تلغرام
    try {
      const msg = `🛍️ طلب جديد\n👤 ${customer.name}\n📞 ${customer.phone}\n📍 ${customer.city} - ${customer.address}\n💰 الإجمالي: ${money(total)}`;
      fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TG_CHAT_ID, text: msg })
      });
    } catch(_){}

    CART = [];
    saveCart();
    $('cart-drawer').classList.remove('open');
    showToast('تم استلام طلبك بنجاح! سنتواصل معك قريباً.');
    e.target.reset();
    
  } catch (err) {
    showToast(err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'إرسال الطلب';
  }
};

// =======================================================
// تأثير حركة الخلفية مع الماوس (Parallax)
// =======================================================
const orb1 = $('orb1'), orb2 = $('orb2'), orb3 = $('orb3');
document.addEventListener('mousemove', (e) => {
  const x = (e.clientX / window.innerWidth - 0.5) * 40;
  const y = (e.clientY / window.innerHeight - 0.5) * 40;
  
  orb1.style.transform = `translate(${x * 1.5}px, ${y * 1.5}px)`;
  orb2.style.transform = `translate(${-x * 1.2}px, ${-y * 1.2}px)`;
  orb3.style.transform = `translate(${x}px, ${-y}px)`;
});

// تشغيل
loadProducts();
updateCartUI();
</script>
</body>
