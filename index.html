<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALYASIMIN ABAYA</title>
<meta name="description" content="عرض أزياء ثلاثي الأبعاد.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--ink:#16191f;--mid:#737b86;--dim:#a4adb8;--line:#e6ebf0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff}
body{font-family:'Tajawal','Cairo',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wide{font-family:'Cairo',sans-serif;font-weight:600}

.page{height:100svh;min-height:520px;display:grid;grid-template-rows:auto 1fr;background:#fff}
header{position:relative;z-index:5;background:#fff;padding:calc(20*var(--u)) calc(46*var(--u)) calc(15*var(--u))}
.r1{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.brand{font-size:calc(17*var(--u));letter-spacing:.06em;font-weight:700}
.tabs{display:flex;gap:calc(34*var(--u));font-size:calc(13.5*var(--u));color:var(--dim)}
.tabs a{transition:color .25s}
.tabs a:hover,.tabs .on{color:var(--ink)}
.acct{justify-self:end;display:flex;align-items:center;gap:calc(16*var(--u));font-size:calc(11.5*var(--u))}

main{position:relative;display:grid;grid-template-columns:1fr calc(372*var(--u));min-height:0}
.stage{position:relative;overflow:hidden;min-width:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:none;
  background:linear-gradient(transparent 60%,rgba(255,255,255,.72) 100%),linear-gradient(90deg,#f1f5fa 0%,#e7eff6 38%,#eef4f9 62%,#f6f9fc 100%)}
.line{position:absolute;inset:0}

/* ====== المانيكانات في العمق ====== */
.m{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,filter;cursor:none; display:flex; align-items:flex-end; justify-content:center;}
/* إخفاء المربع الأبيض من الصورة ليندمج مع الخلفية */
.m img{display:block;width:100%;height:100%;object-fit:contain; mix-blend-mode: multiply; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.15));}
/* ظل أرضي للمانيكان */
.m:before{content:"";position:absolute;left:10%;right:10%;bottom:-1.6%;height:3.6%;border-radius:50%;background:radial-gradient(closest-side,rgba(70,85,105,.2),transparent); z-index: -1;}

.intro{position:absolute;z-index:2;right:calc(46*var(--u));top:calc(36*var(--u));width:calc(390*var(--u));text-align:right;pointer-events:none}
.intro h2{font-weight:600;font-size:calc(22*var(--u));line-height:1.2}
.intro p{margin-top:calc(16*var(--u));font-size:calc(14*var(--u));line-height:1.62;color:var(--mid)}
.tag{position:absolute;z-index:2;right:calc(46*var(--u));bottom:calc(44*var(--u))}
.look{display:flex;font-size:calc(26*var(--u));gap:.5em;font-weight:600;pointer-events:none}
.win{height:calc(38*var(--u));overflow:hidden}
.roll{display:block;will-change:transform}
.roll b{display:block;font-weight:600;height:calc(38*var(--u))}
.shop{display:inline-block;margin-top:calc(12*var(--u));font-size:calc(11.5*var(--u));border-bottom:1px solid currentColor}

.ring{position:absolute;z-index:4;left:0;top:0;width:calc(46*var(--u));height:calc(46*var(--u));margin:calc(-23*var(--u)) 0 0 calc(-23*var(--u));border:calc(2.5*var(--u)) solid #16191f;border-radius:99px;pointer-events:none;opacity:0;transition:width .22s, height .22s, margin .22s, opacity .2s}
.ring.show{opacity:1}
.ring.drag{width:calc(84*var(--u));height:calc(34*var(--u));margin:calc(-17*var(--u)) 0 0 calc(-42*var(--u))}

/* ====== القائمة الجانبية ====== */
.rail{position:relative;overflow:hidden;background:#f3f6fa;min-height:0}
.card{position:absolute;left:0;top:0;width:100%;display:flex;flex-direction:column;padding:calc(18*var(--u)) calc(24*var(--u));will-change:transform;background:#f3f6fa}
.card.alt{background:#fff}
.fav{position:absolute;right:calc(22*var(--u));top:calc(18*var(--u));width:calc(22*var(--u));height:calc(22*var(--u));z-index:1;color:var(--ink)}
.fav svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4;transition:fill .2s}
.fav[aria-pressed=true] svg{fill:#d8a7a0;stroke:#b98179}
.shot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
.shot img{max-width:100%;max-height:100%;object-fit:contain; mix-blend-mode: multiply; filter: drop-shadow(0 8px 8px rgba(0,0,0,0.1));}
.meta{display:grid;grid-template-columns:1fr auto;align-items:end;margin-top:calc(8*var(--u))}
.meta h3{font-weight:600;font-size:calc(12*var(--u))}
.meta span{display:block;grid-column:1;margin-top:calc(6*var(--u));font-size:calc(13*var(--u));color:var(--mid)}
.add{grid-column:2;grid-row:1/3;width:calc(26*var(--u));height:calc(26*var(--u));position:relative;transition:transform .2s}
.add:before,.add:after{content:"";position:absolute;left:50%;top:50%;width:calc(15*var(--u));height:1.5px;margin:-.75px 0 0 calc(-7.5*var(--u));background:var(--ink)}
.add:after{transform:rotate(90deg)}
.add:hover{transform:rotate(90deg)}

.wait{position:fixed;inset:0;z-index:9;background:#f1f5fa;transition:opacity .5s;pointer-events:none}
.wait.gone{opacity:0}

@media (max-width:820px){
  :root{--u:1px}
  header{padding:14px 16px 12px}
  .r1{grid-template-columns:1fr auto}
  .tabs{display:none}
  .brand{font-size:14px}
  main{grid-template-columns:1fr;grid-template-rows:1fr 190px}
  .stage{cursor:auto}.m{cursor:auto}.ring{display:none}
  .intro{right:16px;top:18px;width:calc(100% - 32px)}
  .intro h2{font-size:17px}
  .intro p{display:none}
  .tag{right:16px;bottom:18px}
  .look{font-size:20px;line-height:30px}.win,.roll b{height:30px}
  .card{width:160px;height:100%;padding:12px}
  .fav{right:10px;top:10px}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="r1">
      <a class="brand wide" href="#">ALYASIMIN ABAYA</a>
      <nav class="tabs wide">
        <a class="on" href="#">المنصة</a>
        <a href="#">الدار</a>
        <a href="#">الكتالوج</a>
        <a href="#">المتجر</a>
      </nav>
      <div class="acct wide">
        <a href="#">حسابي</a>
        <a href="#">السلة (<span id="cart">0</span>)</a>
      </div>
    </div>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="عرض الأزياء" tabindex="0">
      <div class="line" id="line"></div>
      <div class="intro">
        <h2 class="wide">ربيع صيف 2027</h2>
        <p>دراسة في النعومة والقوة. مجموعة الموسم الجديد من ALYASIMIN ABAYA تمزج بين الأنسجة الرقيقة والقصّات العصرية.</p>
      </div>
      <div class="tag">
        <div class="look wide"><span>إطلالة</span><span class="win"><span class="roll" id="roll"></span></span></div>
        <a class="shop wide" href="#">تسوّقي الإطلالة</a>
      </div>
      <div class="ring" id="ring"></div>
    </section>
    <aside class="rail" id="rail"></aside>
  </main>
</div>
<div class="wait" id="wait"></div>

<script>
// =======================================================
// روابط الصور
// =======================================================
const IMAGE_URL = 'https://cdn.arabsstock.com/uploads/images/98331/brown-gulf-abaya-with-luxurious-thumbnail-98331.webp';

// المنتجات الجانبية (تم تعديلها لتكون متوافقة مع التصميم)
const ITEMS = [
  { name: 'عباية بنية فاخرة', price: '1,000 د.ل' },
  { name: 'حزام جلدي ذهبي', price: '250 د.ل' },
  { name: 'حقيبة يد كلاسيكية', price: '450 د.ل' },
  { name: 'طرحة حرير ناعمة', price: '120 د.ل' },
  { name: 'عباية سهرة', price: '1,200 د.ل' },
  { name: 'إكسسوارات ذهبية', price: '300 د.ل' }
];

// إعدادات العمق (وهي نفس أرقام الكود الأصلي لتعطي إحساس الممر)
const KX=[1.2,.744,.496,.346,.235,.15,.085], KF=[1.14,.89,.777,.704,.651,.616,.59], KH=[1.18,.832,.574,.436,.334,.258,.19],
      KB=[0,0,1.5,4,8,12,17], KO=[1,1,1,1,.86,.5,0];

const N = 6; // عدد المانيكانات
const $ = id => document.getElementById(id);
const wrap = (x,n) => ((x%n)+n)%n;
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));

const stage=$('stage'), rail=$('rail'), ring=$('ring'), roll=$('roll'), line=$('line');

// =======================================================
// بناء المانيكانات في العمق
// =======================================================
const people = [];
for(let i=0; i<N; i++) {
  const e = document.createElement('div'); e.className='m'; e.dataset.i=i;
  const img = document.createElement('img');
  img.src = IMAGE_URL;
  e.append(img);
  line.append(e);
  people.push({ e, r: 0.8, f:'', o:'' }); // r: نسبة العرض للطول
}

// =======================================================
// بناء القائمة الجانبية
// =======================================================
const cards = [];
ITEMS.forEach((item, i) => {
  const e = document.createElement('article'); e.className = 'card' + (i%2?' alt':'');
  e.innerHTML = `
    <button class="fav" aria-pressed="false" aria-label="حفظ"><svg viewBox="0 0 24 24"><path d="M12 20S3.5 15 3.5 9A4.6 4.6 0 0 1 12 6.6 4.6 4.6 0 0 1 20.5 9C20.5 15 12 20 12 20Z"/></svg></button>
    <span class="shot"><img src="${IMAGE_URL}"></span>
    <div class="meta">
      <h3 class="wide">${item.name}</h3>
      <span>${item.price}</span>
      <button class="add" aria-label="أضيفي"></button>
    </div>`;
  rail.append(e); cards.push(e);
});

// عداد الإطلالات
for(let i=0; i<=N; i++){
  const b = document.createElement('b'); b.textContent = i%N + 1; roll.append(b);
}

let cart = 0;
rail.addEventListener('click', e => {
  const f = e.target.closest('.fav');
  if(f) f.setAttribute('aria-pressed', f.getAttribute('aria-pressed') !== 'true');
  if(e.target.closest('.add')) $('cart').textContent = ++cart;
});

// =======================================================
// محرك الحركة (Physics & Layout)
// =======================================================
let W=0, H=0, base=0, cardS=0, side=false, dirty=true, p=0, target=0, last=0;

function size(){
  W = stage.clientWidth; H = stage.clientHeight;
  base = H * 1.2;
  side = innerWidth <= 820;
  
  // ضبط أبعاد المانيكانات بناءً على نسبة الصورة
  people.forEach(m => {
    m.e.style.width = (base * 0.6) + 'px'; // عرض مناسب للصورة
    m.e.style.height = base + 'px';
  });
  
  cardS = side ? 160 : (rail.clientHeight / 3);
  cards.forEach(c => c.style.height = side ? '100%' : cardS + 'px');
  dirty = true;
}

function paint(){
  people.forEach((m, i) => {
    let d = wrap(i - p, N); 
    if(d > N-1) d -= N;
    
    const k = clamp(d+1, 0, 6);
    const a = Math.floor(k), b = Math.min(6, a+1), t = k-a;
    const mix = A => A[a] + (A[b]-A[a])*t;
    
    const h = mix(KH) * H;
    const s = h / base;
    const w = h * 0.6; // الحفاظ على نسبة عرض الصورة
    const x = mix(KX) * W - w/2;
    const y = mix(KF) * H - h;
    
    m.e.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${s.toFixed(4)})`;
    
    const f = mix(KB)/s, fs = f < .2 ? 'none' : `blur(${f.toFixed(1)}px)`, o = mix(KO).toFixed(3);
    if(fs !== m.f) { m.f = fs; m.e.style.filter = fs; }
    if(o !== m.o) { m.o = o; m.e.style.opacity = o; }
    
    m.e.style.zIndex = 100 - Math.round(d*10);
  });
  
  const all = cardS * ITEMS.length;
  cards.forEach((c, i) => {
    let y = wrap(i*cardS - p*2*cardS, all);
    if(y > all-cardS) y -= all;
    c.style.transform = side ? `translate3d(${y.toFixed(1)}px, 0, 0)` : `translate3d(0, ${y.toFixed(1)}px, 0)`;
  });
  
  if(roll.firstChild) {
    roll.style.transform = `translate3d(0, ${(-wrap(p, N) * roll.firstChild.offsetHeight).toFixed(1)}px, 0)`;
  }
}

function frame(now){
  const dt = Math.min(50, now-last) || 16; last = now;
  const was = p;
  p += (target - p) * (1 - Math.exp(-dt * .0072));
  if(Math.abs(target - p) < .0004) p = target;
  
  if(p !== was || dirty) { dirty = false; paint(); }
  
  cx += (mx - cx) * .32; cy += (my - cy) * .32;
  if(ring) ring.style.transform = `translate3d(${cx.toFixed(1)}px, ${cy.toFixed(1)}px, 0)`;
  
  requestAnimationFrame(frame);
}

// =======================================================
// التفاعل (ماوس، لمس، عجلة)
// =======================================================
let mx=0, my=0, cx=0, cy=0, down=false, sx=0, st=0, moved=0, wheelT=0;
const PULL = () => Math.max(150, W * 0.2);

stage.addEventListener('pointerenter', e => { if(e.pointerType === 'mouse') ring.classList.add('show'); });
stage.addEventListener('pointerleave', () => ring.classList.remove('show'));

stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  mx = e.clientX - r.left; my = e.clientY - r.top;
  if(!down) return;
  const dx = e.clientX - sx;
  moved = Math.max(moved, Math.abs(dx));
  target = st + dx / PULL();
});

stage.addEventListener('pointerdown', e => {
  if(e.target.closest('a')) return;
  down = true; sx = e.clientX; st = target; moved = 0;
  stage.setPointerCapture(e.pointerId); ring.classList.add('drag');
});

function release(e){
  if(!down) return; down = false; ring.classList.remove('drag');
  if(moved < 6){
    const hit = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList && x.classList.contains('m'));
    if(hit) {
      let d = wrap(+hit.dataset.i - target, N); d = Math.round(d);
      if(d > 0 && d < N) target = Math.round(target) + d;
    }
  } else {
    target = Math.round(target);
  }
}

stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);

stage.addEventListener('wheel', e => {
  e.preventDefault();
  target += clamp(e.deltaY + e.deltaX, -120, 120) / 420;
  clearTimeout(wheelT);
  wheelT = setTimeout(() => { target = Math.round(target); }, 150);
}, { passive: false });

addEventListener('keydown', e => {
  if(['ArrowRight','ArrowDown'].includes(e.key)) { e.preventDefault(); target = Math.round(target) + 1; }
  if(['ArrowLeft','ArrowUp'].includes(e.key)) { e.preventDefault(); target = Math.round(target) - 1; }
});

// =======================================================
// التشغيل
// =======================================================
addEventListener('resize', size);

// محاكاة تحميل الصورة لإخفاء شاشة الانتظار
const tempImg = new Image();
tempImg.src = IMAGE_URL;
tempImg.onload = () => {
  size();
  paint();
  $('wait').classList.add('gone');
};
// في حال تأخر التحميل، نبدأ بعد ثانيتين
setTimeout(() => { size(); paint(); $('wait').classList.add('gone'); }, 2000);

size();
requestAnimationFrame(frame);
</script>
</body>
</html>
