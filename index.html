<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALYASIMIN ABAYA | متجر العبايات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16191f;--mid:#737b86;--line:#e6ebf0;--gold:#b98179;--err:#c0392b;--bg:#fff;--soft:#f8f9fa}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wide{font-family:'Cairo',sans-serif;font-weight:600}

/* Header */
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:16px 24px}
.header-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;letter-spacing:.06em;font-weight:700}
.nav-tools{display:flex;gap:20px;align-items:center;font-size:14px}
.nav-tools a{cursor:pointer;color:var(--mid)}
.nav-tools a:hover{color:var(--ink)}

/* Hero */
.hero{max-width:1200px;margin:0 auto;padding:40px 24px 20px;text-align:center}
.hero h1{font-size:32px;font-weight:600;margin-bottom:12px}
.hero p{font-size:16px;color:var(--mid);max-width:600px;margin:0 auto;line-height:1.7}

/* Grid */
.container{max-width:1200px;margin:0 auto;padding:30px 24px 80px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px 20px}
.product-card{position:relative;display:flex;flex-direction:column;cursor:pointer;transition:transform .3s}
.product-card:hover{transform:translateY(-4px)}
.img-wrap{position:relative;width:100%;padding-top:133%;background:var(--soft);border-radius:4px;overflow:hidden;margin-bottom:14px}
.img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img-wrap .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a4adb8;font-size:12px}
.fav-btn{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.8);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:2}
.fav-btn.saved{color:var(--gold)}
.product-info{text-align:center}
.product-info h3{font-size:15px;font-weight:600;margin-bottom:6px}
.product-info .price{font-size:14px;color:var(--mid);font-weight:600}
.add-btn{position:absolute;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:10px;font-size:12px;font-weight:600;text-align:center;opacity:0;transform:translateY(10px);transition:.3s;z-index:2}
.product-card:hover .add-btn{opacity:1;transform:translateY(0)}

/* Quick View Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(22,25,31,.6);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-content{background:#fff;width:100%;max-width:900px;max-height:90vh;border-radius:8px;overflow:hidden;display:flex;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-close{position:absolute;top:16px;left:16px;width:32px;height:32px;background:var(--soft);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:5}
.modal-img{width:50%;background:var(--soft);position:relative}
.modal-img img{width:100%;height:100%;object-fit:cover;display:block}
.modal-details{width:50%;padding:40px;overflow-y:auto;display:flex;flex-direction:column}
.modal-details h2{font-size:24px;font-weight:600;margin-bottom:8px}
.modal-details .price{font-size:18px;color:var(--mid);margin-bottom:20px;font-weight:600}
.modal-details .desc{font-size:14px;color:var(--mid);line-height:1.8;margin-bottom:24px}
.size-title{font-size:12px;font-weight:600;margin-bottom:10px}
.sizes{display:flex;gap:8px;margin-bottom:30px;flex-wrap:wrap}
.size-option{border:1px solid #dce2e9;min-width:44px;padding:10px;font-size:13px;border-radius:4px}
.size-option[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.size-option:disabled{opacity:.3;cursor:not-allowed;text-decoration:line-through}
.btn-primary{display:block;width:100%;background:var(--ink);color:#fff;padding:16px;font-size:14px;font-weight:600;text-align:center;border-radius:4px;margin-top:auto;transition:background .2s}
.btn-primary:hover{background:#39434e}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* Cart Drawer */
.cart-drawer{position:fixed;top:0;left:0;bottom:0;width:min(400px,100%);background:#fff;z-index:200;box-shadow:10px 0 40px rgba(0,0,0,.1);transform:translateX(-100%);transition:transform .4s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column}
.cart-drawer.open{transform:translateX(0)}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.cart-head h2{font-size:18px}
.cart-body{flex:1;overflow-y:auto;padding:24px}
.cart-item{display:flex;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}
.cart-item img{width:70px;height:90px;object-fit:cover;border-radius:4px;background:var(--soft)}
.cart-item-info{flex:1}
.cart-item-info h4{font-size:14px;font-weight:600;margin-bottom:4px}
.cart-item-info p{font-size:13px;color:var(--mid);margin-bottom:8px}
.qty-controls{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:4px 8px;border-radius:4px;width:fit-content}
.qty-controls button{font-size:16px}
.qty-controls span{font-size:13px;min-width:16px;text-align:center}
.cart-foot{padding:24px;border-top:1px solid var(--line);background:#fff}
.cart-total{display:flex;justify-content:space-between;font-size:16px;font-weight:600;margin-bottom:20px}

/* Checkout Form */
.checkout-form{display:none}
.checkout-form.active{display:block}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.form-group input,.form-group textarea{width:100%;padding:12px;border:1px solid #dce2e9;font:14px 'Tajawal',sans-serif;border-radius:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:4px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:300;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.visible{opacity:1;transform:translate(-50%,0)}

@media(max-width:768px){
  .modal-content{flex-direction:column;max-height:95vh}
  .modal-img{width:100%;height:300px}
  .modal-details{width:100%;padding:24px}
  .hero h1{font-size:24px}
  .grid{grid-template-columns:repeat(2,1fr);gap:16px}
  .img-wrap{padding-top:150%}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand wide" href="#">ALYASIMIN ABAYA</a>
    <div class="nav-tools wide">
      <a id="nav-cart">السلة (<span id="cart-count">0</span>)</a>
    </div>
  </div>
</header>

<section class="hero">
  <h1 class="wide">نعومة. قوة. أنتِ.</h1>
  <p>مجموعة حصرية من العبايات والفساتين المصممة بعناية لتناسب أناقتك. اكتشفي القطع الجديدة الآن.</p>
</section>

<main class="container">
  <div class="grid" id="products-grid">
    <!-- المنتجات ستظهر هنا -->
  </div>
</main>

<!-- Quick View Modal -->
<div class="modal-overlay" id="quick-view-modal">
  <div class="modal-content">
    <button class="modal-close" id="qv-close">×</button>
    <div class="modal-img">
      <img id="qv-img" src="" alt="">
    </div>
    <div class="modal-details">
      <h2 id="qv-name" class="wide"></h2>
      <div class="price" id="qv-price"></div>
      <p class="desc" id="qv-desc"></p>
      
      <div class="size-title wide">اختاري المقاس</div>
      <div class="sizes" id="qv-sizes"></div>
      
      <button class="btn-primary wide" id="qv-add-btn">أضيفي إلى السلة</button>
    </div>
  </div>
</div>

<!-- Cart Drawer -->
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-head">
    <h2 class="wide">سلة التسوق</h2>
    <button id="cart-close" style="font-size:24px">×</button>
  </div>
  <div class="cart-body" id="cart-body">
    <!-- Cart items here -->
  </div>
  <div class="cart-foot" id="cart-foot">
    <div id="cart-summary">
      <div class="cart-total wide">
        <span>الإجمالي</span>
        <span id="cart-total-price">0 د.ل</span>
      </div>
      <button class="btn-primary wide" id="checkout-btn">متابعة الطلب</button>
    </div>
    
    <!-- Checkout Form -->
    <form class="checkout-form" id="checkout-form">
      <div class="form-group">
        <label class="wide">الاسم الكامل</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="wide">رقم الهاتف</label>
          <input type="tel" name="phone" required>
        </div>
        <div class="form-group">
          <label class="wide">المدينة</label>
          <input type="text" name="city" required>
        </div>
      </div>
      <div class="form-group">
        <label class="wide">العنوان بالتفصيل</label>
        <textarea name="address" rows="2" required></textarea>
      </div>
      <button type="submit" class="btn-primary wide" id="submit-order-btn">إرسال الطلب</button>
      <button type="button" class="btn-secondary wide" id="back-to-cart" style="margin-top:10px; background:#eee; color:#333">رجوع</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, addDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDOfbi23sVHpexkESPsmTlbuxbKcRgh2wo",
  authDomain: "ayya-25562.firebaseapp.com",
  projectId: "ayya-25562",
  storageBucket: "ayya-25562.firebasestorage.app",
  messagingSenderId: "317439048144",
  appId: "1:317439048144:web:d304d450842a09bc13e1d5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const TG_TOKEN = '8930560233:AAGLXXXkt8hIkmH1ylrMKCMa4C5LZPh0Lus';
const TG_CHAT_ID = '8562530371';
const SIZES = ['XS','S','M','L','XL'];

let PRODUCTS = [];
let CART = []; // { id, size, qty, product }
let CURRENT_QV_PRODUCT = null;
let SELECTED_SIZE = null;

const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat('ar-LY',{style:'currency',currency:'LYD',maximumFractionDigits:0}).format(n) + ' د.ل';

// Load Cart from LocalStorage
try { CART = JSON.parse(localStorage.getItem('alyasimin-cart') || '[]'); } catch(e){}

function saveCart() {
  localStorage.setItem('alyasimin-cart', JSON.stringify(CART));
  updateCartUI();
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('visible'), 3000);
}

// ========== Load Products ==========
function loadProducts() {
  onSnapshot(collection(db, 'products'), snap => {
    PRODUCTS = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=>(a.order||0)-(b.order||0));
    renderGrid();
    updateCartUI(); // refresh cart in case product details changed
  });
}

function renderGrid() {
  const grid = $('products-grid');
  if (!PRODUCTS.length) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:50px;color:#737b86">لا توجد منتجات متاحة حالياً.</div>';
    return;
  }

  grid.innerHTML = PRODUCTS.map(p => {
    const hasImg = p.imageUrl && p.imageUrl.trim() !== '';
    const imgHTML = hasImg 
      ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy">` 
      : `<div class="placeholder">لا توجد صورة</div>`;

    return `
      <div class="product-card" data-id="${p.id}">
        <div class="img-wrap">
          ${imgHTML}
          <button class="add-btn wide" data-add="${p.id}">إضافة سريعة</button>
        </div>
        <div class="product-info">
          <h3 class="wide">${p.name}</h3>
          <div class="price">${money(p.price)}</div>
        </div>
      </div>
    `;
  }).join('');

  // Add Click Listeners
  grid.querySelectorAll('.product-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('[data-add]')) {
        e.stopPropagation();
        quickAdd(e.target.closest('[data-add]').dataset.add);
        return;
      }
      openQuickView(card.dataset.id);
    });
  });
}

// ========== Quick View ==========
function openQuickView(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  CURRENT_QV_PRODUCT = p;
  SELECTED_SIZE = null;

  $('qv-img').src = p.imageUrl || '';
  $('qv-img').style.display = p.imageUrl ? 'block' : 'none';
  $('qv-name').textContent = p.name;
  $('qv-price').textContent = money(p.price);
  $('qv-desc').textContent = p.desc || 'قطعة مميزة من مجموعتنا الجديدة.';

  const sizesHTML = SIZES.map(s => {
    const stock = p.stock?.[s] || 0;
    return `<button class="size-option wide" data-size="${s}" ${stock < 1 ? 'disabled' : ''} aria-pressed="false">${s}</button>`;
  }).join('');
  
  $('qv-sizes').innerHTML = sizesHTML;
  $('qv-sizes').querySelectorAll('.size-option').forEach(btn => {
    btn.addEventListener('click', () => {
      $('qv-sizes').querySelectorAll('.size-option').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      SELECTED_SIZE = btn.dataset.size;
      $('qv-add-btn').disabled = false;
    });
  });

  $('qv-add-btn').disabled = true; // disable until size is chosen
  $('qv-add-btn').textContent = 'أضيفي إلى السلة';

  $('quick-view-modal').classList.add('open');
}

$('qv-close').onclick = () => $('quick-view-modal').classList.remove('open');
$('quick-view-modal').onclick = (e) => { if(e.target === $('quick-view-modal')) $('quick-view-modal').classList.remove('open'); };

$('qv-add-btn').onclick = () => {
  if (!CURRENT_QV_PRODUCT || !SELECTED_SIZE) return;
  addToCart(CURRENT_QV_PRODUCT.id, SELECTED_SIZE);
  $('quick-view-modal').classList.remove('open');
};

function quickAdd(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  const firstSize = SIZES.find(s => (p.stock?.[s] || 0) > 0);
  if (!firstSize) { showToast('نفد المخزون من هذه القطعة'); return; }
  addToCart(p.id, firstSize);
}

// ========== Cart ==========
function addToCart(id, size) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  const existing = CART.find(r => r.id === id && r.size === size);
  
  if (existing) {
    // check max stock
    if (existing.qty + 1 > (p.stock?.[size] || 0)) { showToast('الكمية المطلوبة غير متوفرة'); return; }
    existing.qty++;
  } else {
    CART.push({ id, size, qty: 1 });
  }
  saveCart();
  showToast('تمت الإضافة إلى السلة');
  openCart();
}

function updateCartUI() {
  const count = CART.reduce((s, r) => s + r.qty, 0);
  $('cart-count').textContent = count;

  const body = $('cart-body');
  if (CART.length === 0) {
    body.innerHTML = '<div style="text-align:center;color:#737b86;margin-top:40px">سلتك فارغة</div>';
    $('cart-summary').style.display = 'none';
    return;
  }

  $('cart-summary').style.display = 'block';
  let total = 0;
  
  body.innerHTML = CART.map((row, i) => {
    const p = PRODUCTS.find(x => x.id === row.id) || { name: 'منتج محذوف', price: 0, imageUrl: '' };
    const lineTotal = p.price * row.qty;
    total += lineTotal;
    return `
      <div class="cart-item">
        <img src="${p.imageUrl || ''}" alt="">
        <div class="cart-item-info">
          <h4 class="wide">${p.name}</h4>
          <p>مقاس: ${row.size} | ${money(p.price)}</p>
          <div class="qty-controls">
            <button data-action="minus" data-i="${i}">−</button>
            <span>${row.qty}</span>
            <button data-action="plus" data-i="${i}">+</button>
          </div>
        </div>
        <div class="wide" style="font-size:14px">${money(lineTotal)}</div>
      </div>
    `;
  }).join('');

  $('cart-total-price').textContent = money(total);

  // Wire qty buttons
  body.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = () => {
      const i = Number(btn.dataset.i);
      const action = btn.dataset.action;
      if (action === 'plus') {
        const row = CART[i];
        const p = PRODUCTS.find(x => x.id === row.id);
        if (row.qty + 1 > (p?.stock?.[row.size] || 0)) { showToast('الكمية غير متوفرة'); return; }
        row.qty++;
      } else {
        CART[i].qty--;
        if (CART[i].qty < 1) CART.splice(i, 1);
      }
      saveCart();
    };
  });
}

$('nav-cart').onclick = openCart;
$('cart-close').onclick = () => $('cart-drawer').classList.remove('open');

function openCart() {
  $('cart-drawer').classList.add('open');
  $('checkout-form').classList.remove('active');
  $('cart-summary').style.display = CART.length ? 'block' : 'none';
  updateCartUI();
}

// ========== Checkout ==========
$('checkout-btn').onclick = () => {
  if (!CART.length) return;
  $('cart-summary').style.display = 'none';
  $('checkout-form').classList.add('active');
};

$('back-to-cart').onclick = () => {
  $('checkout-form').classList.remove('active');
  $('cart-summary').style.display = 'block';
};

$('checkout-form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('submit-order-btn');
  btn.disabled = true; btn.textContent = 'جارٍ التحقق من المخزون...';

  const formData = new FormData(e.target);
  const customer = {
    name: formData.get('name'),
    phone: formData.get('phone'),
    city: formData.get('city'),
    address: formData.get('address')
  };

  try {
    let total = 0;
    const orderItems = [];

    for (const row of CART) {
      const pSnap = await getDoc(doc(db, 'products', row.id));
      if (!pSnap.exists()) throw new Error('منتج غير موجود');
      const p = pSnap.data();
      const stock = p.stock?.[row.size] || 0;
      
      if (stock < row.qty) {
        throw new Error(`الكمية غير كافية لـ ${p.name} (مقاس ${row.size})`);
      }
      
      total += p.price * row.qty;
      orderItems.push({ id: row.id, name: p.name, size: row.size, qty: row.qty, price: p.price });
    }

    // Save Order
    const orderData = {
      customer,
      items: orderItems,
      total,
      status: 'pending',
      createdAt: serverTimestamp()
    };
    
    await addDoc(collection(db, 'orders'), orderData);

    // Send Telegram (Optional)
    try {
      const msg = `🛍️ طلب جديد\n👤 ${customer.name}\n📞 ${customer.phone}\n📍 ${customer.city} - ${customer.address}\n💰 الإجمالي: ${money(total)}`;
      fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TG_CHAT_ID, text: msg })
      });
    } catch(_){}

    // Success
    CART = [];
    saveCart();
    $('cart-drawer').classList.remove('open');
    showToast('تم استلام طلبك بنجاح! سنتواصل معك قريباً.');
    e.target.reset();
    
  } catch (err) {
    showToast(err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'إرسال الطلب';
  }
};

// Init
loadProducts();
updateCartUI();
</script>
</body>
</html>
